[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioplt"
version = "1.1.0"
description = "Tested Matplotlib components for custom biological and genomic figures."
readme = "README.md"
license = "MIT"
authors = [{ name = "mbilal-OU" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "mkdocs>=1.6",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Documentation = "https://mbilal-ou.github.io/matplotlib-genomic-figures/"
Repository = "https://github.com/mbilal-OU/matplotlib-genomic-figures"
Issues = "https://github.com/mbilal-OU/matplotlib-genomic-figures/issues"

[tool.setuptools.packages.find]
include = ["bioplt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bioplt --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/_build_readme_gallery.py" = ["E501"]
