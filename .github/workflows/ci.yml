name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff

      - name: Lint with ruff
        run: ruff check bioplt/ scripts/ tests/

      - name: Regenerate datasets (determinism check)
        run: |
          python scripts/generate_datasets.py
          git diff --exit-code -- data/*.csv || (echo "::error::Generated data differs from committed data. Did you forget to regenerate and commit data/*.csv?" && exit 1)

      - name: Run tests
        run: pytest tests/ -v

      - name: Execute tutorial notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/matplotlib_beginner_guide.ipynb \
            --ExecutePreprocessor.timeout=180
