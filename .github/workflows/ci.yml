name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Lint
        run: ruff check bioplt scripts tests

      - name: Verify deterministic datasets
        run: |
          python scripts/generate_datasets.py
          git diff --exit-code -- data

      - name: Test with coverage
        run: pytest -q

      - name: Render advanced gallery
        env:
          MPLBACKEND: Agg
        run: python scripts/build_advanced_gallery.py

      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/matplotlib_beginner_guide.ipynb --ExecutePreprocessor.timeout=240
          jupyter nbconvert --to notebook --execute --inplace notebooks/scientific_figure_case_studies.ipynb --ExecutePreprocessor.timeout=240

      - name: Build package and documentation
        run: |
          python -m build
          mkdocs build --strict
